services:
  - type: web
    name: gta6-ai-system-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: APP_ACCESS_TOKEN
        sync: false
      - key: OPENAI_MODEL
        value: gpt-6.1-terra
