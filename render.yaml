services:
  - type: web
    name: gta6-ai-system-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: APP_ACCESS_TOKEN
        sync: false
      - key: OPENAI_MODEL
        value: gpt-6.1-terra
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: AI_PROVIDER
        value: auto

